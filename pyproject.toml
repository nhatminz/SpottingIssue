[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-issue-pipeline"
version = "0.1.0"
description = "Auditable Vietnamese legal issue candidate generation with two-way debate"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
local = ["torch>=2.6", "transformers>=4.51,<5", "accelerate>=1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "lm-format-enforcer>=0.10,<0.12"]

[project.scripts]
legal-issues = "legal_issue_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

